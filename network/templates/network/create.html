{% extends "network/layout.html" %}

{% block body %}

      <div class="heading d-flex justify-content-center">
    <h3>Create Post</h3>
    
</div>  
<div class="container">
{%if message%}
    <h5>{{message}}</h5>
{%endif%}
<form action="{% url 'create' %}" method="post">
{% csrf_token%}
    {{form}}
    <input class=" btn btn-sm btn-outline-primary" type="submit">
    </form>
</div>
{% endblock %}
